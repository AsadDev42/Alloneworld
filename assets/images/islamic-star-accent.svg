<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <g fill="none" stroke="#c5a059" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer concentric 8-point star -->
    <rect x="7" y="7" width="18" height="18" />
    <rect x="7" y="7" width="18" height="18" transform="rotate(45 16 16)" />
    <!-- Inner concentric diamond -->
    <rect x="11.5" y="11.5" width="9" height="9" fill="rgba(197, 160, 89, 0.15)" stroke-width="0.8" />
    <!-- Center focal point -->
    <circle cx="16" cy="16" r="1.5" fill="#c5a059" />
  </g>
</svg>